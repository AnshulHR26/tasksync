# Render Blueprint: creates the web app and its PostgreSQL database in one step.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo -> Apply.
services:
  - type: web
    name: daily-tasks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daily-tasks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ALLOW_REGISTRATION
        value: "true"

databases:
  - name: daily-tasks-db
    plan: free
    databaseName: taskdb
    user: taskapp
